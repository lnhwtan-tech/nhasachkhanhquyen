<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Nhà Sách Khánh Quyên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thêm thư viện Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand': { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' },
                        'dark': '#0f172a',
                    },
                    fontFamily: { 'sans': ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">

    <!-- HIỆU ỨNG NỀN TRANG TRÍ -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden relative z-10 my-8">
        
        <!-- HEADER FORM -->
        <div class="bg-dark text-white p-8 text-center relative">
            <a href="index.html" class="absolute top-6 left-6 bg-slate-800 hover:bg-slate-700 w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 transition" title="Về trang chủ">
                <i class="fa-solid fa-house text-sm"></i>
            </a>
            <div class="bg-brand-600 text-white w-12 h-12 rounded-2xl mx-auto flex items-center justify-center font-extrabold text-xl shadow-lg mb-3">KQ</div>
            <h1 class="text-2xl font-extrabold tracking-tight">Tạo Tài Khoản Thành Viên</h1>
            <p class="text-xs text-slate-400 mt-1">Tham gia ngay cùng Nhà sách & Văn phòng phẩm Khánh Quyên</p>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <form onsubmit="handleRegister(event)" class="p-8 space-y-6">
            
            <!-- TẢI LÊN ẢNH ĐẠI DIỆN TỪ MÁY TÍNH -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2 uppercase tracking-wider text-center">Ảnh Đại Diện (Tải lên từ máy hoặc chọn mẫu)</label>
                
                <div class="flex flex-col items-center justify-center gap-4">
                    <!-- Khu vực hiển thị preview ảnh -->
                    <div class="relative group">
                        <div class="w-24 h-24 rounded-2xl bg-slate-100 border-2 border-slate-200 overflow-hidden shadow-md flex items-center justify-center">
                            <img id="avatarPreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="w-full h-full object-cover">
                        </div>
                    </div>

                    <!-- Nút chọn file tùy chỉnh -->
                    <div class="flex items-center gap-3">
                        <label class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold cursor-pointer transition shadow flex items-center gap-2">
                            <i class="fa-solid fa-upload"></i> Chọn ảnh từ máy tính
                            <input type="file" id="uploadAvatar" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                        </label>
                        <button type="button" onclick="useDefaultAvatar()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2.5 rounded-xl text-xs font-bold transition">Dùng mẫu gợi ý</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- TÊN TÀI KHOẢN (USERNAME) -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2 uppercase">Tên tài khoản (Username)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-at"></i></span>
                        <input type="text" id="username" placeholder="Ví dụ: tantan99..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition">
                    </div>
                </div>

                <!-- HỌ VÀ TÊN -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2 uppercase">Họ và tên hiển thị</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="fullname" placeholder="Ví dụ: Nguyễn Văn Tân..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- SỐ ĐIỆN THOẠI -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2 uppercase">Số điện thoại</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" id="phone" placeholder="090xxxxxxxx..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition">
                    </div>
                </div>

                <!-- MẬT KHẨU -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2 uppercase">Mật khẩu</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Mật khẩu bảo mật..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- EMAIL -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2 uppercase">Địa chỉ Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="example@gmail.com..." required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition">
                    </div>
                </div>

                <!-- GIỚI TÍNH -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2 uppercase">Giới tính</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-venus-mars"></i></span>
                        <select id="gender" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- NÚT ĐĂNG KÝ -->
            <button type="submit" id="register-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-brand-600/30 transition text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản Ngay
            </button>

            <div class="text-center pt-2">
                <span class="text-xs text-slate-500">Đã có tài khoản trên hệ thống?</span> 
                <a href="login.html" class="text-xs font-bold text-brand-600 hover:underline ml-1">Đăng nhập tại đây</a>
            </div>
        </form>
    </div>

    <script>
        const supabaseUrl = 'https://dngnkhzliwsdmytrvoae.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuZ25raHpsaXdzZG15dHJ2b2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDkyMjcsImV4cCI6MjEwMzk4NTIyN30.fqZuesECwMbvbcnc4XSyGZZrPxTG5YbrPk1MlNHZB58';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let userAvatarData = "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix";

        // Xử lý khi người dùng chọn file ảnh từ máy tính
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    userAvatarData = e.target.result; // Chuyển ảnh thành chuỗi base64
                    document.getElementById('avatarPreview').src = userAvatarData;
                }
                reader.readAsDataURL(file);
            }
        }

        // Quay lại dùng ảnh mặc định nếu không muốn tải ảnh lên
        function useDefaultAvatar() {
            userAvatarData = "https://api.dicebear.com/7.x/avataaars/svg?seed=" + Math.random();
            document.getElementById('avatarPreview').src = userAvatarData;
            document.getElementById('uploadAvatar').value = '';
        }

        async function handleRegister(e) {
            e.preventDefault();

            const registerBtn = document.getElementById('register-btn');
            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullname').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const email = document.getElementById('email').value.trim();
            const gender = document.getElementById('gender').value;

            registerBtn.disabled = true;
            registerBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Đang xử lý đăng ký...`;

            try {
                // Kiểm tra xem username đã tồn tại chưa
                const { data: existingUser, error: checkError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .maybeSingle();

                if (existingUser) {
                    showCustomAlert("Thông báo", 'Tên tài khoản (username) này đã có người sử dụng. Vui lòng chọn tên khác!', "info");
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản Ngay`;
                    return;
                }

                // Đối tượng user mới để lưu vào database và localStorage
                const newUserObj = {
                    username: username,
                    full_name: fullName,
                    phone: phone,
                    password: password,
                    email: email,
                    gender: gender,
                    avatar: userAvatarData,
                    role: 'customer'
                };

                // Insert dữ liệu mới vào bảng users
                const { data, error } = await supabaseClient
                    .from('users')
                    .insert([newUserObj])
                    .select(); // Thêm .select() để lấy lại object hoàn chỉnh (bao gồm id vừa sinh ra nếu cần)

                if (error) throw error;

                // Lưu thông tin phiên đăng nhập vào localStorage giống hệt logic trang đăng nhập
                const registeredUser = (data && data.length > 0) ? data[0] : newUserObj;
                localStorage.setItem('currentUser', JSON.stringify(registeredUser));

showCustomAlert("Thông báo", 'Đăng ký tài khoản thành công! Chào mừng bạn đến với Khánh Quyên.', "info");
                window.location.href = 'index.html';

            } catch (err) {
                console.error('Lỗi đăng ký:', err.message);
                alert('Có lỗi xảy ra khi đăng ký: ' + err.message);
                registerBtn.disabled = false;
                registerBtn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản Ngay`;
            }
        }
    </script>
</body>
</html>
