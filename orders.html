<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đơn Hàng - Nhà Sách & Văn Phòng Phẩm Khánh Quyên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand': { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 900: '#7f1d1d' },
                        'dark': '#0f172a',
                    },
                    fontFamily: { 'sans': ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-600 selection:text-white" onclick="closeAllDropdowns(event)">
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-12 h-12 rounded-xl overflow-hidden shadow-sm border border-slate-200 shrink-0 bg-amber-400">
                    <img src="khanhquyen.png" alt="Logo Khánh Quyên" class="w-full h-full object-cover">
                </div>
                <div>
                    <span class="text-sm sm:text-base font-extrabold tracking-tight text-dark block leading-none">Nhà Sách & Văn Phòng Phẩm</span>
                    <span class="text-[10px] text-brand-600 font-bold tracking-widest uppercase">KHÁNH QUYÊN</span>
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-6 text-sm font-semibold text-slate-600 shrink-0">
                <a href="index.html" class="hover:text-brand-600 transition">Trang Chủ</a>
                <a href="products.html" class="hover:text-brand-600 transition">Sản Phẩm</a>
                <a href="contact.html" class="hover:text-brand-600 transition">Liên Hệ</a>
            </nav>
            <div class="flex items-center space-x-3 shrink-0">
                <a href="cart.html" class="relative bg-slate-100 hover:bg-slate-200 p-3 rounded-full text-slate-700 transition" title="Giỏ hàng">
                    <i class="fa-solid fa-bag-shopping text-base"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
                </a>
                <div id="auth-action-container" class="relative flex items-center gap-3"></div>
            </div>
        </div>
    </header>
    <main class="py-12">
        <div class="max-w-4xl mx-auto px-6">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-extrabold text-dark tracking-tight">Lịch Sử Đơn Hàng</h1>
                    <p class="text-xs text-slate-500 mt-1">Theo dõi tiến độ và trạng thái các đơn hàng bạn đã đặt tại cửa hàng.</p>
                </div>
                <a href="products.html" class="bg-slate-100 hover:bg-slate-200 text-dark px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua sắm
                </a>
            </div>
            <div id="orders-container" class="space-y-4">
            </div>
        </div>
    </main>
    <script>
        const supabaseUrl = 'https://dngnkhzliwsdmytrvoae.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuZ25raHpsaXdzZG15dHJ2b2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDkyMjcsImV4cCI6MjEwMzk4NTIyN30.fqZuesECwMbvbcnc4XSyGZZrPxTG5YbrPk1MlNHZB58';
        window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-slate-900 text-white' : 'bg-red-600 text-white';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-white';
            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2.5 transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        async function fetchOrders() {
            const container = document.getElementById('orders-container');
            if (!currentUser) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-12 text-center border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-lock text-4xl text-slate-300 mb-3 block"></i>
                        <h3 class="text-base font-bold text-dark mb-1">Vui lòng đăng nhập</h3>
                        <p class="text-xs text-slate-500 mb-4">Bạn cần đăng nhập để xem lịch sử các đơn hàng đã đặt.</p>
                        <a href="login.html" class="inline-block bg-brand-600 hover:bg-brand-700 text-white px-6 py-3 rounded-xl text-xs font-bold transition">Đăng Nhập Ngay</a>
                    </div>
                `;
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('phone', currentUser.phone)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                renderOrdersList(data || []);
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="text-center py-10 text-xs text-red-500 font-bold">Không thể tải lịch sử đơn hàng lúc này.</div>`;
            }
        }
        function renderOrdersList(orders) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-12 text-center border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3 block"></i>
                        <h3 class="text-base font-bold text-dark mb-1">Chưa có đơn hàng nào</h3>
                        <p class="text-xs text-slate-500 mb-4">Bạn chưa thực hiện giao dịch nào tại cửa hàng chúng tôi.</p>
                        <a href="products.html" class="inline-block bg-brand-600 hover:bg-brand-700 text-white px-6 py-3 rounded-xl text-xs font-bold transition">Khám Phá Sản Phẩm</a>
                    </div>
                `;
                return;
            }
            orders.forEach(order => {
                let itemsList = [];
                try {
                    itemsList = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
                } catch (e) { itemsList = []; }
                let statusColor = 'bg-amber-50 text-amber-600 border-amber-200';
                let statusText = order.status || 'Đang xử lý';
                if (statusText === 'Đã hoàn thành') statusColor = 'bg-emerald-50 text-emerald-600 border-emerald-200';
                if (statusText === 'Đã hủy') statusColor = 'bg-red-50 text-red-600 border-red-200';
                let itemsHtml = itemsList.map(item => `
                    <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0 text-xs">
                        <div class="flex items-center gap-3">
                            <img src="${item.image || 'https://via.placeholder.com/60'}" class="w-10 h-10 object-cover rounded-lg border border-slate-200 shrink-0">
                            <div>
                                <span class="font-bold text-dark block">${item.name}</span>
                                <span class="text-slate-400">Số lượng: ${item.quantity}</span>
                            </div>
                        </div>
                        <span class="font-extrabold text-brand-600">${(item.price * item.quantity).toLocaleString('vi-VN')} đ</span>
                    </div>
                `).join('');
                container.innerHTML += `
                    <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-100">
                            <div>
                                <span class="text-[11px] font-bold text-slate-400 block uppercase">Mã đơn hàng: #${order.id}</span>
                                <span class="text-xs font-semibold text-slate-500"><i class="fa-regular fa-clock mr-1"></i> ${new Date(order.created_at).toLocaleString('vi-VN')}</span>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-extrabold border w-fit ${statusColor}">${statusText}</span>
                        </div>
                        <div class="space-y-1">
                            ${itemsHtml}
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                            <span class="text-slate-500 font-medium">Tổng thanh toán (${order.payment_method || 'Tiền mặt'}):</span>
                            <span class="text-base font-extrabold text-brand-600">${Number(order.total_amount).toLocaleString('vi-VN')} đ</span>
                        </div>
                    </div>
                `;
            });
        }
        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }
        function updateHeaderAuth() {
            const container = document.getElementById('auth-action-container');
            if (currentUser) {
                const avatar = currentUser.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix";
                const fullName = currentUser.full_name || currentUser.fullName || "Thành viên";
                container.innerHTML = `
                    <div class="relative">
                        <button onclick="toggleUserDropdown(event)" class="flex items-center gap-2.5 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-2xl border border-slate-200 transition cursor-pointer">
                            <img src="${avatar}" class="w-7 h-7 rounded-full object-cover border border-slate-300">
                            <span class="text-xs font-bold text-slate-800 max-w-[120px] truncate">${fullName}</span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-500"></i>
                        </button>
                        <div id="userDropdownMenu" class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 hidden z-50 overflow-hidden py-1">
                            <a href="orders.html" class="flex items-center gap-2 px-4 py-2.5 text-xs font-bold text-brand-600 bg-brand-50 transition border-b border-slate-100"><i class="fa-solid fa-box-archive w-4"></i> Lịch Sử Đơn Hàng</a>
                            <a href="profile.html" class="flex items-center gap-2 px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-slate-50 transition"><i class="fa-solid fa-user-pen w-4"></i> Hồ Sơ Cá Nhân</a>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `<a href="login.html" class="bg-dark hover:bg-brand-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow">Đăng Nhập</a>`;
            }
        }
        function toggleUserDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('userDropdownMenu');
            if (menu) menu.classList.toggle('hidden');
        }
        function closeAllDropdowns() {
            const menu = document.getElementById('userDropdownMenu');
            if (menu) menu.classList.add('hidden');
        }
        updateCartBadge();
        updateHeaderAuth();
        fetchOrders();
</script>
    <div id="mobile-nav-container"></div>
<script>
    fetch('mobile-nav.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('mobile-nav-container').innerHTML = data;
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            if (currentPage.includes("index")) highlightNav("nav-home");
            else if (currentPage.includes("product")) highlightNav("nav-products");
            else if (currentPage.includes("cart")) highlightNav("nav-cart");
            else if (currentPage.includes("profile")) highlightNav("nav-profile");
        });
    function highlightNav(id) {
        const el = document.getElementById(id);
        if (el) {
            el.classList.remove('text-slate-500', 'font-medium');
            el.classList.add('text-brand-600', 'font-bold');
        }
    }
    </script>

<div id="mobile-nav-container"></div>
<script>
    fetch('mobile-nav.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('mobile-nav-container').innerHTML = data;
            function highlightNav(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('text-slate-700', 'font-medium');
                    el.classList.add('text-brand-600', 'font-bold');
                }
            }
            const currentPage = window.location.pathname.split("/").pop() || "index.html";
            if (currentPage.includes("index") || currentPage === "") highlightNav("nav-home");
            else if (currentPage.includes("product")) highlightNav("nav-products");
            else if (currentPage.includes("contact")) highlightNav("nav-contact");
            const authSlot = document.getElementById('nav-auth-slot');
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (authSlot) {
                if (currentUser) {
                    const fullName = currentUser.full_name || currentUser.fullName || "Tài khoản";
                    const shortName = fullName.split(" ").pop() || "Cá nhân";
                    const avatar = currentUser.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix";
                    authSlot.innerHTML = `
                        <a href="profile.html" id="nav-auth" class="flex flex-col items-center text-slate-700 text-[10px] font-medium transition py-0.5">
                            <img src="${avatar}" class="w-5 h-5 rounded-full object-cover mb-1 border border-white/60 shadow-sm">
                            <span class="max-w-[50px] truncate">${shortName}</span>
                        </a>
                    `;
                    if (currentPage.includes("profile")) highlightNav("nav-auth");
                } else {
                    authSlot.innerHTML = `
                        <a href="login.html" id="nav-auth" class="flex flex-col items-center text-slate-700 text-[10px] font-medium transition py-0.5">
                            <i class="fa-solid fa-right-to-bracket text-base mb-1"></i> Đăng Nhập
                        </a>
                    `;
                    if (currentPage.includes("login") || currentPage.includes("register")) highlightNav("nav-auth");
                }
            }
        });
</script>
</body>
</html>
